[project]
name = "digital-futures"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pipaber", email = "p.palacios.bernuy@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.35",
    "fastapi>=0.162.6",
    "langchain-openrouter>=0.2.9",
    "langchain-tavily>=0.2.18",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
digital-futures = "digital_futures:main"
digital-futures-web = "digital_futures.api:web"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ty.environment]
python = ".venv"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
